name: GitHub Hosted Runners

on:
  push:

jobs:
  ubuntu-job:
    runs-on: ubuntu-latest
    steps:
      - name: Print operating system
        run: 'echo "Operating System: ${{ runner.os }}"'

      - name: Print hostname
        run: hostname

      - name: Print current user
        run: whoami

      - name: Check preinstalled tools
        run: |
          echo "Docker version:"
          docker --version

          echo "Python version:"
          python3 --version

          echo "Node.js version:"
          node --version

          echo "Git version:"
          git --version

  windows-job:
    runs-on: windows-latest
    steps:
      - name: Print operating system
        run: 'echo "Operating System: ${{ runner.os }}"'

      - name: Print hostname
        run: hostname

      - name: Print current user
        run: whoami

  macos-job:
    runs-on: macos-latest
    steps:
      - name: Print operating system
        run: 'echo "Operating System: ${{ runner.os }}"'

      - name: Print hostname
        run: hostname

      - name: Print current user
        run: whoami
