name: Artifacts Between Jobs

on:
  push:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate report
        run: |
          echo "Report generated by Job 1" > report.txt
          echo "Status: SUCCESS" >> report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: job-report
          path: report.txt

  consume:
    needs: generate
    runs-on: ubuntu-latest

    steps:
      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: job-report

      - name: Read report
        run: cat report.txt
