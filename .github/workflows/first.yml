# Workflows [No  indentation required for naming the workflow]
name : Hello

# On tells when the workflow should run (Give indentation by tab)
on:   
  workflow_dispatch: 

# Job tells what the workflow should do, there can be one or more jobs, hence we write Jobs
# jobs is an object so needs indentation
jobs:
  # 1st Job (give indentation)
  say-hello:
  # create an Ephermal container with Ubuntu running
    runs-on: ubuntu-latest
    # That ephermal container will have steps to excute, hence name those steps and use run:
    steps:
      - name : Say hello to everyone
        run: echo "Hello Dosto"
